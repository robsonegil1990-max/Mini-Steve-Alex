name: Compilar Mini Steve e Mini Alex 1.16.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar e verificar o mod Forge
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Obter codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Testar regras locais e validar arquivos
        run: |
          set -euo pipefail
          bash tests/verificar_offline.sh

      - name: Obter Gradle Wrapper do Forge 36.1.0 original
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.1.0/forge-1.16.5-36.1.0-mdk.zip' \
            --output /tmp/forge-mdk.zip
          echo 'a4fec6b3ecc5a36e2b10ce4eeca48fea31b74fb0  /tmp/forge-mdk.zip' | sha1sum --check
          mkdir -p /tmp/forge-mdk
          unzip -q /tmp/forge-mdk.zip -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew ./gradlew
          cp /tmp/forge-mdk/gradlew.bat ./gradlew.bat
          cp -r /tmp/forge-mdk/gradle ./gradle
          chmod +x ./gradlew


     
      - name: Compilar JAR Forge (inclui remapeamento)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/caches/forge_gradle/mcp_repo/de/oceanlabs/mcp/mcp_config/1.16.5"
          mkdir -p "$HOME/.gradle/caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550"
          ./gradlew --no-daemon --stacktrace --console=plain build


      - name: Confirmar estrutura interna do arquivo compilado
        run: |
          set -euo pipefail
          JAR='build/libs/mini-companheiros-1.16.5-0.3.0.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^META-INF/mods.toml$'
          jar tf "$JAR" | grep -q '^br/com/minicompanheiros/MiniCompanheiros.class$'
          jar tf "$JAR" | grep -q '^br/com/minicompanheiros/CompanheiroEntity.class$'
          jar tf "$JAR" | grep -q '^assets/minicompanheiros/textures/item/mini_steve.png$'
          jar tf "$JAR" | grep -q '^data/minicompanheiros/recipes/mini_steve.json$'
          sha256sum "$JAR" | tee SHA256.txt

      - name: Disponibilizar JAR compilado para baixar
        uses: actions/upload-artifact@v4
        with:
          name: mini-steve-alex-1.16.5-JAR
          path: |
            build/libs/mini-companheiros-1.16.5-0.3.0.jar
            SHA256.txt
          if-no-files-found: error
          retention-days: 30
